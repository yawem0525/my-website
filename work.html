<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班表工時與薪資計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- 頂部導航列 -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⏱️</span>
        <div>
          <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">工時與薪資計算系統</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">時薪純工時/加班自選 • 當日工時月曆顯示 • 常用班別自訂</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openPresetManagerModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
          <span>⚙️</span> 管理常用班別
        </button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" title="切換深淺色">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- 薪資設定與開關列 -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
        <!-- 月份切換 -->
        <div class="flex items-center gap-3">
          <button onclick="changeMonth(-1)" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition">◀</button>
          <span id="currentMonthLabel" class="text-lg font-bold min-w-[120px] text-center tracking-wide text-slate-900 dark:text-white">-- 年 -- 月</span>
          <button onclick="changeMonth(1)" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition">▶</button>
          <button onclick="goToCurrentMonth()" class="text-xs px-2.5 py-1.5 rounded-md bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-medium">本月</button>
        </div>

        <!-- 匯出與排班操作 -->
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="openShiftModal(null)" class="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition">
            <span>＋</span> 新增排班
          </button>
          <button onclick="exportCSV()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition">
            📥 匯出 CSV
          </button>
          <button onclick="copySummaryText()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 transition">
            📋 複製結算摘要
          </button>
        </div>
      </div>

      <!-- 時薪 / 津貼 / 扣款 / 加班開關 -->
      <div class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-indigo-50/60 dark:bg-slate-700/40 p-3 rounded-xl border border-indigo-100 dark:border-slate-600">
            <div class="flex items-center justify-between mb-1">
              <label for="hourlyRateInput" class="text-xs font-bold text-indigo-900 dark:text-indigo-200">每小時時薪 (NT\$)</label>
              <span class="text-[10px] text-indigo-500 dark:text-indigo-300">自填</span>
            </div>
            <div class="relative">
              <span class="absolute left-3 top-2 text-sm text-slate-400 font-bold">\$</span>
              <input type="number" id="hourlyRateInput" value="190" min="0" step="1" oninput="updateSalaryConfig()"
                class="w-full pl-7 pr-3 py-1.5 text-base font-bold text-indigo-700 dark:text-indigo-300 bg-white dark:bg-slate-800 border border-indigo-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <div class="bg-emerald-50/60 dark:bg-slate-700/40 p-3 rounded-xl border border-emerald-100 dark:border-slate-600">
            <div class="flex items-center justify-between mb-1">
              <label for="allowanceInput" class="text-xs font-bold text-emerald-900 dark:text-emerald-200">全勤 / 津貼加項 (NT\$)</label>
              <span class="text-[10px] text-emerald-500 dark:text-emerald-300">加項</span>
            </div>
            <div class="relative">
              <span class="absolute left-3 top-2 text-sm text-slate-400 font-bold">\$</span>
              <input type="number" id="allowanceInput" value="0" min="0" step="10" oninput="updateSalaryConfig()"
                class="w-full pl-7 pr-3 py-1.5 text-base font-bold text-emerald-700 dark:text-emerald-300 bg-white dark:bg-slate-800 border border-emerald-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>

          <div class="bg-rose-50/60 dark:bg-slate-700/40 p-3 rounded-xl border border-rose-100 dark:border-slate-600">
            <div class="flex items-center justify-between mb-1">
              <label for="insuranceInput" class="text-xs font-bold text-rose-900 dark:text-rose-200">勞健保 / 扣款 (NT\$)</label>
              <span class="text-[10px] text-rose-500 dark:text-rose-300">減項</span>
            </div>
            <div class="relative">
              <span class="absolute left-3 top-2 text-sm text-slate-400 font-bold">\$</span>
              <input type="number" id="insuranceInput" value="0" min="0" step="10" oninput="updateSalaryConfig()"
                class="w-full pl-7 pr-3 py-1.5 text-base font-bold text-rose-700 dark:text-rose-300 bg-white dark:bg-slate-800 border border-rose-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
          </div>
        </div>

        <!-- 加班計算開關 -->
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-700">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="disableOvertimeToggle" onchange="toggleOvertimeConfig()"
              class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300 dark:border-slate-600 dark:bg-slate-700">
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200">
              關閉加班費計算（不拆算 1.34x / 1.67x，整月所有工時一律按原時薪直接乘以工時）
            </span>
          </label>
          <span id="overtimeStatusBadge" class="text-[11px] px-2 py-0.5 rounded font-medium bg-amber-100 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300">勞基法加班開啟中</span>
        </div>
      </div>
    </section>

    <!-- 統計概覽卡片 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">出勤天數 / 排班</p>
        <p class="mt-2 text-2xl font-bold text-slate-800 dark:text-white" id="statWorkDays">0 <span class="text-xs font-normal text-slate-400">天</span></p>
        <p class="mt-1 text-[11px] text-slate-400">休假天數: <span id="statOffDays">0</span> 天</p>
      </div>

      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" id="statHoursTitle">一般工時</p>
        <p class="mt-2 text-2xl font-bold text-slate-800 dark:text-white" id="statRegularHours">0.0 <span class="text-xs font-normal text-slate-400">小時</span></p>
        <p class="mt-1 text-[11px] text-slate-400">工資試算: NT\$ <span id="statBaseSalary">0</span></p>
      </div>

      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm" id="cardOvertimeBox">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">加班時數 (加成)</p>
        <p class="mt-2 text-2xl font-bold text-amber-600 dark:text-amber-400" id="statOvertimeHours">0.0 <span class="text-xs font-normal text-slate-400">小時</span></p>
        <p class="mt-1 text-[11px] text-slate-400">加班費: NT\$ <span id="statOvertimePay">0</span></p>
      </div>

      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm ring-1 ring-brand-500/30">
        <p class="text-xs font-bold text-brand-600 dark:text-brand-400">本月預估實領金額</p>
        <p class="mt-2 text-2xl font-black text-brand-600 dark:text-brand-400" id="statNetSalary">NT\$ 0</p>
        <p class="mt-1 text-[11px] text-slate-400">全月總工時: <span id="statTotalHours">0.0</span> 小時</p>
      </div>
    </section>

    <!-- 檢視切換分頁 -->
    <div class="flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
      <button onclick="switchView('calendar')" id="tabBtnCalendar" class="px-4 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm border border-slate-200 dark:border-slate-700">
        📅 日曆檢視 (直接顯示每日工時)
      </button>
      <button onclick="switchView('list')" id="tabBtnList" class="px-4 py-2 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white">
        📝 清單明細表
      </button>
    </div>

    <!-- 日曆檢視區塊 -->
    <section id="calendarViewContainer" class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm">
      <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 py-2 border-b border-slate-100 dark:border-slate-700 mb-2">
        <div class="text-rose-500">週日</div>
        <div>週一</div>
        <div>週二</div>
        <div>週三</div>
        <div>週四</div>
        <div>週五</div>
        <div class="text-rose-500">週六</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 min-h-[520px]">
        <!-- 動態渲染日曆格子 -->
      </div>
    </section>

    <!-- 清單明細表 -->
    <section id="listViewContainer" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 dark:bg-slate-700/60 text-slate-500 dark:text-slate-300 font-semibold uppercase border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="p-3">日期</th>
              <th class="p-3">班別名稱</th>
              <th class="p-3">上班時段</th>
              <th class="p-3">休息扣除</th>
              <th class="p-3">當日實際總工時</th>
              <th class="p-3">當日薪資試算</th>
              <th class="p-3">備註</th>
              <th class="p-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="listTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 彈窗 1：排班編輯 Modal -->
  <div id="shiftModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <div>
          <h3 class="text-base font-bold text-slate-900 dark:text-white" id="modalDateTitle">排班設定</h3>
          <p class="text-xs text-slate-400">點擊常用班別可一鍵快速填入時段</p>
        </div>
        <button onclick="closeShiftModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg font-bold">✕</button>
      </div>

      <!-- 快速帶入常用班別 -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-bold text-slate-500 dark:text-slate-400">常用班別選取：</label>
          <button type="button" onclick="openPresetManagerModal()" class="text-xs text-brand-600 dark:text-brand-400 hover:underline font-semibold flex items-center gap-1">
            ⚙️ 自訂/增刪班別
          </button>
        </div>
        <div id="quickPresetContainer" class="flex flex-wrap gap-1.5"></div>
      </div>

      <form id="shiftForm" onsubmit="saveShiftRecord(event)" class="space-y-3">
        <input type="hidden" id="formDate">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">班別名稱</label>
            <input type="text" id="shiftTitle" required placeholder="如：早班、外送
